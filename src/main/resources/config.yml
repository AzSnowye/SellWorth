# Logging settings
log:
  # Define whether transactions will be logged to the console/main server log
  toConsole: true
  # Define whether transactions will be logged to a separate log
  toFile: true
  # Date format of transactions (http://docs.oracle.com/javase/7/docs/api/java/text/SimpleDateFormat.html)
  formatDate: "yyyy/MM/dd HH:mm:ss"
  # Log message for bought command
  formatBuyCommand: "%player% bought %amount% x %command% command for %price% from %shop% shop"
  # Log message for bought enchantment
  formatBuyEnchantment: "%player% bought %enchantment% enchantment for %price% from %shop% shop"
  # Log message for bought permission
  formatBuyPermission: "%player% bought %permission% permission for %price% from %shop% shop"
  # Log message for bought items
  formatBuy: "%player% bought %amount% x %item% for %price% from %shop% shop"
  # Log message for sold items
  formatSell: "%player% sold %amount% x %item% for %price% to %shop% shop"
  # Log message for sold all items
  formatSellAll: "%player% sold all %amount% x %item% for %price% to %shop% shop"

# Settings
storage:
  type: yaml # yaml, sqlite, mysql
  migrate-from-yaml: true
  sqlite:
    file: sellworth.db
  mysql:
    host: localhost
    port: 3306
    database: sellworth
    username: root
    password: ""
    useSSL: false

lore:
  - '&7Nilai: &#15e30f$%amount%'
display-worth-lore: true # show worth lore in inventory & chest GUIs by default
use-new-sell-menu: false # use new sell menu or not
use-multipliers: true # use multipliers or not

# Notification
sell-notify-mode: CHAT
sell-notify:
  screen:
    title: "&a+$%amount% Gins"
    subtitle: "&7Anda menjual %items% item"

# GUIs that ARE allowed to show worth lore in their top inventory (substring match, case-insensitive)
worth-gui-names:
  - chest        # matches Chest, Large Chest, Ender Chest, etc.

sounds:
  page-switch: ITEM_BOOK_PAGE_TURN
  close-sound: ENTITY_EXPERIENCE_ORB_PICKUP
  click-sound: UI_BUTTON_CLICK
  declined: ENTITY_VILLAGER_NO

messages:
  expired-wand: '&cSell Wand Anda telah kedaluwarsa dan dihapus.'
  empty-chest: '&7Peti kosong - tidak ada yang bisa dijual.'
  worth: '&#10a5eb 1 %item% &7bernilai &#3bef0f$%amount%'
  worth-invalid: '&7Item tidak dikenal: &#10a5eb%input%'
  cannot-sell: '&#10a5ebAnda tidak dapat menjual item tersebut!'
  worth-enabled: "&#34ee80Lore nilai: &aAKTIF"
  worth-disabled: "&#34ee80Lore nilai: &cNONAKTIF"

disabled-items:
  - BARRIER
  - LIGHT
  - SPAWN_EGG
  - SPAWNER
  - BEDROCK

sell-axe:
  use-countdown: true
  duration-seconds: 259200 # 3 days

  display-name: '&dAmethyst Sell Wand'
  lore:
